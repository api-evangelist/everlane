aid: everlane
name: everlane
description: >-
  Everlane is a San Francisco-based direct-to-consumer apparel and footwear brand
  known for its "Radical Transparency" model — publishing factory sourcing, true
  costs, and markups on everyday wardrobe essentials. As an API Evangelist network
  entry, Everlane has no bespoke public developer program; its online store runs on
  Shopify and exposes an agent-facing commerce surface: a live Storefront MCP server
  at everlane.com/api/mcp (product search, cart, product details, and policy/FAQ
  lookup), a Universal Commerce Protocol (UCP) profile at /.well-known/ucp, a
  published /llms.txt of agent instructions, and Shopify Customer Account OIDC/OAuth2
  authentication. Surfaced as a Slow Ventures portfolio company and enriched from its
  public agent, well-known, and authentication surfaces.
